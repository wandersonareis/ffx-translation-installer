<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/appicon.png" />
    <meta name="viewport" content="width=896, height=504, user-scalable=no" />
    <script>
      // Tema inicial ANTES do Vue: segue o sistema operacional. O config.json
      // (lido pelo backend) sobrescreve quando houver escolha salva.
      (function () {
        try {
          document.documentElement.dataset.theme =
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>Installer Translation FINAL FANTASY X and X-2 HD Remaster</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
